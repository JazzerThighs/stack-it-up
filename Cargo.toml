[package]
name = "cube-stack"
version = "0.1.0"
edition = "2024"
description = "Browser adapter for the Stack It Up game and packing explorer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-api = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true


[workspace]
members = ["crates/puzzle-core"]
resolver = "3"

[dependencies]
stack-it-up-core = { path = "crates/puzzle-core" }
