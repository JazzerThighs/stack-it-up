name: Publish Stack It Up and Packing Explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned development tools
        run: npm ci --ignore-scripts
      - name: Reject unresolved merge conflicts
        run: node tools/check-conflicts.mjs
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
      - name: Select Rust toolchain
        run: rustup default 1.91.1
      - name: Verify shared piece catalog
        run: |
          node tools/generate-pieces.mjs --check
          node tests/piece-catalog.mjs
      - name: Test shared settings
        run: node tools/test.mjs settings
      - name: Test rules
        run: cargo test --workspace --offline
      - name: Install local archive extractor
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Build browser app
        run: node tools/build.mjs
      - name: Verify current rules and browser modules
        run: |
          node tests/engine-contract.mjs
          node tests/frontend-smoke.mjs
          node tests/packing-data.mjs
          node tests/packing-performance.mjs
          node tests/model-export.mjs
          node tests/explorer-model.mjs
          node tests/official-presentation.mjs
          node tests/explorer-smoke.mjs
          node tests/family-exploration.mjs
          node tests/version-build.mjs
          node tests/render-performance.mjs
          node tests/spatial-rendering.mjs
          node tests/solid-identities.mjs
      - name: Real browser loading and recovery smoke
        run: node tests/real-browser.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
